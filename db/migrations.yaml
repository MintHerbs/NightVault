  - id: "0039"
    file: sql/0039_fix_vote_sync_triggers.sql
    description: "T-068. FIRST MIGRATION IN THIS RANGE THAT CHANGES BEHAVIOUR. Fixes two independent defects that each alone made posts.upvotes/downvotes permanently wrong: the sync triggers never fired on UPDATE (the client switches a vote via an upsert, which is an UPDATE), and the sync functions were not SECURITY DEFINER, so their 'update posts' ran as anon against an always-false RLS policy and silently affected zero rows. Adds OR UPDATE, makes both functions SECURITY DEFINER with a pinned search_path (also clearing advisor lint 0011), and backfills every drifted row. Verified 2026-07-27: 2 of 2 vote rows had stored counts of 0 against real counts of 1."
    author: agent
    created: 2026-07-27
    applied_envs: ["prod"]
    related_issues: ["T-068", "E-008"]

  - id: "0040"
    file: sql/0040_fix_post_flag_trigger.sql
    description: "T-068 follow-on, third instance of the 0039 defect. handle_post_flag() was not SECURITY DEFINER, so its 'update posts set flag_count' ran as anon against the always-false update_own_posts policy and matched zero rows: flagging has never incremented flag_count, set is_flagged, or reached the >=10 moderation branch. Makes it SECURITY DEFINER with a pinned search_path, backfills flag_count from post_flags, and enables RLS on flagged_posts_review (advisor lint 0013, ERROR; no client references it and the service role bypasses RLS). Does NOT touch the T-069 ownership-policy problem. Applied to prod 2026-07-27."
    author: agent
    created: 2026-07-27
    applied_envs: ["prod"]
    related_issues: ["T-068", "T-069", "E-008"]

  - id: "0041"
    file: sql/0041_social_write_rpcs.sql
    description: "T-069: vote_post, vote_comment, flag_post and update_own_post as SECURITY DEFINER RPCs that filter on the caller's claimed session_id internally, extending the pattern soft_delete_post already uses. Fixes vote switching (blocked by the missing UPDATE policy on both vote tables), un-voting and un-flagging (silently zero rows, since delete_own_votes can never match and post_flags has no DELETE policy), and post editing. Chosen over relaxing the policies to USING (true), which would have handed anon a blanket DELETE on every vote row. Also ensures a sessions row exists, closing a latent FK violation for a visitor who votes before posting. Applied to prod 2026-07-27 and verified end to end as the anon role: vote, switch, un-vote, flag and unflag all succeed and counts stay in sync."
    author: agent
    created: 2026-07-27
    applied_envs: ["prod"]
    related_issues: ["T-069", "T-064", "E-008"]

  - id: "0042"
    file: sql/0042_note_authorship.sql
    description: "T-071: notes.created_by (stamped once on INSERT, unlike updated_by which is overwritten every save), note_authors multi-author ledger, admin_users.display_name/avatar_url, and admin_profiles_public (a public-safe view so anon/authenticated can resolve a name/avatar without RLS access to admin_users itself). Splits the trigger: notes_set_metadata (BEFORE) now also stamps created_by; a new notes_track_author (AFTER) writes note_authors, separate because its note_id FK needs the notes row to already exist. Backfills created_by/updated_by and note_authors for every pre-existing note per the verified table in T-071 (Rheva for computer-architecture lecture-{1,2,3}, Munazir for math sem 1 plus Nahla as a second note_authors row there, Munazir for all other still-unattributed notes); computer-architecture sem 2 and the programming module are untouched since no rows exist there yet."
    author: agent
    created: 2026-07-28
    applied_envs: []
    related_issues: ["T-071", "E-009"]
  - id: "0043"
    file: sql/0043_contributor_settings.sql
    description: "T-072: contributor_cards (self-row RLS, public read, backs /about and Settings' contributor-card form), admin_update_own_profile SECURITY DEFINER RPC (writes only admin_users.display_name/avatar_url, the two public-safe columns 0042 added), and the avatars Storage bucket (public read; insert/update scoped to the caller's own admin_user_id via the path's second segment, profile/{id}/... and contributor-card/{id}/...). Note that revoking EXECUTE from PUBLIC is NOT sufficient to keep anon out of the RPC on this project: default privileges grant EXECUTE on new public-schema functions directly to anon, so anon is revoked explicitly too (verified against a local stack by reading pg_proc.proacl back). Applied to prod 2026-07-28 via the Studio SQL editor; scripts/migrate-team-to-contributor-cards.mjs run immediately after (7/7 cards, photos confirmed resolving over HTTP)."
    author: agent
    created: 2026-07-28
    applied_envs: ["prod"]
    related_issues: ["T-072", "E-009"]
