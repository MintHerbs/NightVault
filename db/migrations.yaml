  - id: "0050"
    file: sql/0050_courses_cover.sql
    description: "T-077 follow-on: courses.cover_preset/cover_ascii/cover_anim let the primary owner choose a card's ASCII cover animation in the admin panel, either a named preset or an uploaded image converted to character art client-side (src/lib/asciiArt/imageToAscii.js). The grid is stored as ~3 KB of text rather than the image as a Storage file, so a card needs no second round trip and there is no orphan-cleanup lifecycle to own (cf. T-002 for note images); the source image is deliberately not retained. CHECK constraints bound cover_anim to the animation names in bitmapField.js (keep the two in step) and cover_ascii to 20 KB. No new RLS: 0049 already grants public SELECT, and writes stay under 0026's primary-owner update policy. Additive and schema-agnostic about courses.id's type — see 0049's header. NUMBERING: authored as 0047 and merged in PR #72 under the filename 0047_courses_cover.sql, which collided with 0047_social_write_hardening.sql (T-078) already registered here; renumbered to 0050 in this follow-up, same reasoning as 0049. Applied to prod 2026-08-01 via the Supabase management API, alongside 0044/0047/0048/0051 — see 0047's entry for why that batch went out together."
