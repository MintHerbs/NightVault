  - id: "0051"
    file: sql/0051_erd_generation_quota.sql
    description: "Spam/quota protection for api/gemini.js. erd_rate_limits counts generations per caller in a sliding window; erd_cache stores generated ERD JSON keyed by normalised scenario text so repeats (a cohort working the same past paper, or someone retrying) cost no API call at all. Keyed on a salted SHA-256 of the caller IP rather than a session id, because session ids are client-supplied and can be regenerated per request, so they cannot bound anything. The check and the increment must be one statement or two concurrent requests both read the old count and both pass, hence the SECURITY DEFINER erd_check_and_increment() — same pattern as check_and_increment_rate_limit() in 0037. EXECUTE is revoked from PUBLIC, anon AND authenticated before being granted to service_role: revoking from PUBLIC alone does not block anon on new functions in this project. Both tables have RLS enabled and no policies, so only the service key reaches them. Requires SUPABASE_SECRET_KEY in the Vercel environment; without it api/_lib/erdQuota.js skips limiting and caching entirely rather than failing closed, so the tool still works before this lands. Applied to prod 2026-08-01 via the Supabase management API, alongside 0044/0047/0048/0050 — see 0047's entry."
    author: agent
    created: 2026-07-30
    applied_envs: ["prod"]
    related_issues: ["T-012"]

  - id: "0052"
    file: sql/0052_analytics.sql
    description: "T-086: usage analytics for the admin panel. Adds page_hits, note_reads, route_transitions and tool_events as per-day aggregate counters (not an append-only event log, so row count is bounded by routes x sessions x days and no per-person browsing trail accumulates), plus sessions.first_seen so new-vs-returning is derivable at all — backfilled from last_seen rather than now(), since stamping now() would report the whole historical population as new on the day this runs. Notes get their own table keyed on note identity because keying them by the /notes/:section/* route pattern collapses the entire corpus into one row; the FK to notes also makes deletion clean up read counts. route_transitions deliberately carries no session_id: the aggregate answers 'where do people go next' without the rows being walkable back into one person's path. Writes go only through analytics_record(jsonb), service-role only, called from api/analytics.js — supabase-js .upsert() replaces rather than increments so an accumulating counter cannot be expressed over REST, and api_calls (0003) already demonstrated where open insert RLS on a counter table leads (closed in 0048); these tables accept caller-named text keys so open insert would be strictly worse. The route/event allowlist lives once in src/lib/analytics/eventSchema.js, imported by both the client and the function, rather than being restated in SQL where it would drift. analytics_check_and_increment() + analytics_rate_limits are its own counter rather than a reuse of 0051's, so analytics does not depend on the ERD feature's schema being applied and neither feature's abuse control moves the other. Reads go through analytics_dashboard(integer) -> jsonb, gated by analytics_can_view() on role in (owner, admin) to match the isOwner || isAdmin gate on the Manage users button; one call so every panel describes the same instant. analytics_prune(integer) exists to be run by hand — there is no pg_cron here, so retention is a deliberate act rather than an assumption. EXECUTE revoked from anon explicitly, not just PUBLIC (the grant gotcha noted against 0048/0051). Applied to prod (verified 2026-08-01: the four counter tables, sessions.first_seen, analytics_record/analytics_dashboard/analytics_check_and_increment/analytics_can_view/analytics_prune all present); db:migrate is still blocked by 0024's drift, so this went out via the SQL editor rather than the runner. NOTE: schema_version was left at 50 when 0051 was added; corrected to 52 here, covering both."
    author: agent
    created: 2026-07-31
    applied_envs: ["prod"]
    related_issues: ["T-086"]

  - id: "0053"
    file: sql/0053_profile_name_syncs_contributor_card.sql
    description: "T-106: renaming yourself in Settings now renames your public 'Meet the Team' card. admin_users.display_name (written by admin_update_own_profile, 0043) and contributor_cards.name were unconnected: AboutPage.jsx renders row.name and never reads admin_users, and T-072 only ever specified the card name as a DEFAULT for a card that does not exist yet (AdminSettingsPage.jsx seeds it via row?.name ?? display_name ?? username), never as something that follows a later rename. Companion to 0045, which syncs the opposite direction and the other column. Deliberately CONDITIONAL: the trigger re-points a card whose name still equals the old display_name (or, for cards seeded before display_name existed, the username), and leaves any other name alone. Unconditional mirroring was rejected because scripts/migrate-team-to-contributor-cards.mjs seeded the roster with formal full names ('Munazir Ramjhun') while display_name is free to be a short handle, so it would have overwritten a public page with login handles the first time anyone touched their profile; same principle 0045 states for photos. Guards on `new.display_name is not distinct from old.display_name` because `after update of display_name` fires whenever the column is in the SET list and the RPC assigns both columns on every call, so without it every profile-photo change would bump contributor_cards.updated_at through 0043's trigger; also refuses null/blank, which contributor_cards.name forbids and AboutPage.jsx's .charAt(0) fallback would render as a nameless card. No recursion: it writes only `name`, so 0045's trigger sees photo_url unchanged and writes nothing back. No backfill, unlike 0045's: `avatar_url is null` identified a genuine absence, whereas a name that already differs is ambiguous between stale and deliberate, so pre-existing divergence must be reconciled once by its owner in Settings (the header carries a query listing those rows). EXECUTE revoked from public, anon AND authenticated, not just PUBLIC (the grant gotcha noted against 0048/0051). Applied and behaviourally tested against local dev via docker exec psql (npm run db:migrate is still blocked by 0024's drift): verified the tracking rename propagates, a custom card name does not move, a card seeded from username picks up a first-ever display_name, an admin with no card does not error, blank names are refused, a write-spy trigger confirms the photo-only path issues no card write at all, and re-applying the file is clean. NOT yet applied to prod."
    author: agent
    created: 2026-08-06
    applied_envs: ["dev"]
    related_issues: ["T-106"]
