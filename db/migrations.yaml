  - id: "0045"
    file: sql/0045_contributor_photo_syncs_avatar.sql
    description: "T-072 follow-up: a contributor_cards.photo_url now doubles as admin_users.avatar_url via a SECURITY DEFINER trigger (contributor_cards_sync_avatar), one-directional only (card photo -> profile avatar, never the reverse) so a card's photo shows up in T-071's author avatars and the admin dropdowns without uploading it twice. Implemented as a trigger rather than app code so the invariant holds regardless of how photo_url gets written (Settings page, a future admin tool, or a one-off script). Backfills the 7 rows scripts/migrate-team-to-contributor-cards.mjs already wrote before this migration existed, guarded on avatar_url is null so it can never clobber a profile picture someone set separately. Verified against a local Postgres inside a rolled-back transaction: fires on INSERT, re-fires when photo_url changes, leaves an unrelated/already-set avatar_url untouched when photo_url is null or unchanged, and the backfill only ever fills a null."
    author: agent
    created: 2026-07-28
    applied_envs: ["prod"]
    related_issues: ["T-072", "E-009"]

  - id: "0046"
    file: sql/0046_notes_created_at.sql
    description: "T-076: adds notes.created_at (default now(), backfilled from updated_at for pre-existing rows, since nothing else records the original insert) so the notes listing and the admin browser can order by when a note was written instead of by path. Adds a BEFORE UPDATE trigger pinning created_at to its stored value so a save cannot rewrite it, and a (module_id, created_at) index for the ordering. Reader-side ordering compares created_at at DAY granularity then falls back to a natural-alphanumeric filename sort, so the imprecise backfill degrades to name order rather than a wrong order. NUMBERING: this was authored as 0045 and applied to dev and prod under the filename 0045_notes_created_at.sql before 0045_contributor_photo_syncs_avatar.sql (T-072, PR #65) merged and took that id; it was renumbered to 0046 here. Safe to renumber because neither run went through the npm run db:migrate runner (0024's pre-existing drift still blocks every application, see 0024 and 0044), so no environment has a schema_migrations row binding it to an id. Already applied to dev and prod via docker exec psql and the dashboard SQL editor respectively; re-running the file is idempotent and its backfill is a no-op on a second pass."
    author: agent
    created: 2026-07-29
    applied_envs: ["dev", "prod"]
    related_issues: ["T-076", "E-004"]

  - id: "0047"
    file: sql/0047_social_write_hardening.sql
    description: "T-078: closes the security audit's two critical social-feed findings. (1) session_id was returned in every bulk read of posts/comments/post_votes/comment_votes/poll_votes/post_flags and is the only ownership check vote_post/vote_comment/flag_post/update_own_post/soft_delete_post/soft_delete_comment (0041) trust — reading a stranger's off any feed/thread response was enough to impersonate them into those RPCs. Column-level GRANTs (verified locally: PostgREST returns 42501 for both `select=session_id` and `.eq('session_id', ...)` once the grant is gone) now keep that column out of every anon/authenticated read on those six tables; new get_my_post_votes/get_my_comment_votes/get_my_poll_votes/get_my_post_flags SECURITY DEFINER RPCs answer 'is this mine' from a caller-supplied session_id parameter instead. Deliberately NOT applied to messages — chat has no edit/delete/vote surface for a leaked session_id to be replayed into, and ChatBubble's avatar uses it as a deliberate pseudonymous seed. (2) insert_posts/insert_comments/insert_votes/insert_comment_votes/insert_poll_votes/insert_flags/insert_blacklist and messages' insert policy (0036, 0001) are all WITH CHECK (true); check_bot_blacklist/check_and_increment_rate_limit (0037) are calls the CLIENT chooses to make before inserting, so a direct REST write skipped both. New create_post/create_comment/send_message/vote_poll SECURITY DEFINER RPCs perform those checks themselves before writing; vote_post/vote_comment gain the rate-limit call they were missing (votes had none at all before this); the matching table INSERT/UPDATE/DELETE grants are revoked from anon/authenticated so the direct-REST path is gone, not just discouraged. Also revokes the ambient DELETE/TRUNCATE grants Supabase's project-init default handed every one of these tables (TRUNCATE isn't RLS-aware at all). Residual, documented limitations: session_id is still an unauthenticated client-generated value, so a sybil attacker minting a fresh UUID per request is slowed by check_bot_blacklist's content heuristics, not stopped; and Realtime's postgres_changes payload is built off the replication stream, not a PostgREST-authorized SELECT, so an actively-connected subscriber may still see session_id in payload.new/old at the moment of a change. Applied to local dev via docker exec psql, not npm run db:migrate (still blocked by 0024's pre-existing drift) — verified end-to-end against a locally-rebuilt copy of the 0001-0041 schema (see the ticket for why: this repo's shared local dev database had drifted far past what those migrations describe), not against this exact database. RENUMBERED from 0048 to 0047 when merging against main, which had since taken 0047 for a different, already-merged migration (0045-046 above) by the time this branch caught up. See T-078. APPLIED TO PROD 2026-08-01, five days after the client half of T-078 shipped: until then prod had the new frontend calling create_comment/send_message/create_post/vote_poll/get_my_* against a database where none of them existed, so commenting, chat, posting and poll voting were all returning PGRST202 and the own-post/own-comment controls silently never rendered. Nothing recorded prod's state, which is why the gap went unnoticed — that is finding #7 of this same ticket happening for real. Applied in five parts via the Supabase management API (the runner is still blocked by 0024), then verified as the anon role inside rolled-back transactions: create_post/create_comment/send_message all succeed and omit session_id from their payloads, send_message rejects a javascript: attachment URL and an invalid attachment type, direct INSERT on messages and SELECT of posts.session_id both fail 42501, and every granted read projection the deployed client actually issues still resolves. 0044 was applied first because send_message writes messages.attachment_url/attachment_type."
    author: agent
    created: 2026-07-29
    applied_envs: ["dev", "prod"]
    related_issues: ["T-078"]

  - id: "0048"
    file: sql/0048_storage_limits_and_api_calls_lockdown.sql
    description: "T-078: two independent, low-risk tightenings. (1) note-images and avatars (0023, 0043) were created with no file_size_limit/allowed_mime_types, so Supabase Storage enforced neither and a direct API upload could bypass imageToWebp.js's client-side conversion entirely; caps both at 8 MiB and image/* MIME types. (2) api_calls (0003) shipped with fully open insert/update RLS, flagged as temporary in its own header comment since server-side quota enforcement never happened; closed now since src/lib/geminiService.js and src/hooks/useApiCalls.js are both confirmed dead code (unreferenced elsewhere), leaving anon/authenticated with SELECT only. Applied to local dev via docker exec psql, not npm run db:migrate (still blocked by 0024's drift); the storage UPDATE only affected note-images locally since avatars (0043) had not been applied to that database at the time — idempotent, so it will pick up avatars whenever 0043 runs. RENUMBERED from 0049 to 0048 alongside 0047 above. Applied to prod 2026-08-01 alongside 0047 (verified: note-images and avatars both now report an 8 MiB file_size_limit, and api_calls has no policies left)."
    author: agent
    created: 2026-07-29
    applied_envs: ["dev", "prod"]
    related_issues: ["T-078"]

  - id: "0049"
    file: sql/0049_courses_hidden.sql
    description: "T-077: adds courses.hidden (default false) so the primary owner can hide a course from the public site without deleting it — Subjects, notes and admin_users rows scoped to the course are untouched; only the home grid and the course's own /courses/:id and /notes-browser/:id routes are gated. Read policy follows sidebar_modules' precedent (using (true), hidden filtered client-side) rather than folding is_primary_owner() into the SELECT predicate, since that function is only granted EXECUTE to authenticated and Postgres doesn't guarantee OR short-circuit for the anon role. Writes stay under 0026's existing primary-owner update policy — hidden is just another column on a row only the primary owner may update. Additive and deliberately schema-agnostic about courses.id's type (dev's 0024 table uses uuid, prod's pre-existing one uses text — see 0025's header); this is NOT the place to reconcile that drift. NUMBERING: authored as 0046 and merged in PR #72 under the filename 0046_courses_hidden.sql, which collided with 0046_notes_created_at.sql (T-076) already registered here; renumbered to 0049 in this follow-up. Safe to renumber because it was never applied anywhere and never went through the npm run db:migrate runner (0024's pre-existing drift still blocks every application, see 0024/0044), so no environment holds a schema_migrations row binding it to an id. Already on prod (courses.hidden verified present 2026-08-01) though no entry here ever recorded that; still not applied to local dev — apply via docker exec psql there."
