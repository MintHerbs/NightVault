xt x="341.95" y="192" text-anchor="middle" font-size="13" font-family="JetBrains Mono, monospace" font-weight="bold" style="" fill="rgb(255, 188, 87)">T(4n/9)</text></g><g fill="rgb(0, 0, 0)"><rect x="161.025" y="297" width="54" height="30" stroke-width="1.5" rx="7" style="" fill="rgba(107, 114, 128, 0.15)" stroke="rgb(107, 114, 128)"></rect><text x="188.025" y="316" text-anchor="middle" font-size="13" font-family="JetBrains Mono, monospace" font-weight="bold" style="" fill="rgb(156, 163, 175)">T(1)</text></g><g fill="rgb(0, 0, 0)"><text x="431.9" y="4" fill="rgb(107, 114, 128)" font-size="11.5" font-family="JetBrains Mono, monospace">1 node</text><rect x="490.09999999999997" y="-13" width="25.7" height="26" rx="6" fill="rgba(34, 197, 94, 0.14)" stroke="rgb(34, 197, 94)" stroke-width="0.9"></rect><text x="502.95" y="4" text-anchor="middle" fill="rgb(134, 239, 172)" font-size="12" font-family="JetBrains Mono, monospace" font-weight="700">n</text></g><g fill="rgb(0, 0, 0)"><text x="431.9" y="98" fill="rgb(107, 114, 128)" font-size="11.5" font-family="JetBrains Mono, monospace">2 nodes</text><rect x="497.79999999999995" y="81" width="25.7" height="26" rx="6" fill="rgba(34, 197, 94, 0.14)" stroke="rgb(34, 197, 94)" stroke-width="0.9"></rect><text x="510.65" y="98" text-anchor="middle" fill="rgb(134, 239, 172)" font-size="12" font-family="JetBrains Mono, monospace" font-weight="700">n</text></g><g fill="rgb(0, 0, 0)"><text x="431.9" y="192" fill="rgb(107, 114, 128)" font-size="11.5" font-family="JetBrains Mono, monospace">4 nodes</text><rect x="497.79999999999995" y="175" width="25.7" height="26" rx="6" fill="rgba(34, 197, 94, 0.14)" stroke="rgb(34, 197, 94)" stroke-width="0.9"></rect><text x="510.65" y="192" text-anchor="middle" fill="rgb(134, 239, 172)" font-size="12" font-family="JetBrains Mono, monospace" font-weight="700">n</text></g><g fill="rgb(0, 0, 0)"><rect x="497.79999999999995" y="299" width="79.6" height="26" rx="6" fill="rgba(34, 197, 94, 0.14)" stroke="rgb