  <rect width="690" height="330" fill="#0b0a0a"/>
  <rect x="14" y="14" width="322" height="302" rx="12" fill="#0b0a0a" stroke="rgba(91,140,255,0.28)" stroke-width="1"/>
  <text x="175" y="42" fill="#5B8CFF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle">STACK</text>
