<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 330" width="690" height="330" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="A stack, which is last in first out and where push and pop both happen at the top, beside a queue, which is first in first out and where items enter at the rear and leave at the front">
