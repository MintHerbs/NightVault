  <rect x="117" y="134" width="116" height="34" rx="7" fill="rgba(91,140,255,0.16)" stroke="#5B8CFF" stroke-width="1.4"/><text x="175" y="156.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">C</text>
