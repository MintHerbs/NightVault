<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 300" width="690" height="300" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="A cell in a two dimensional table and the three cells it can be built from">
  <defs><marker id="h5B8CFF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#5B8CFF"/></marker><marker id="hFF5FA2" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#FF5FA2"/></marker><marker id="hA78BFA" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#A78BFA"/></marker><marker id="hEAB308" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EAB308"/></marker><marker id="h2DD4BF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#2DD4BF"/></marker><marker id="h22C55E" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#22C55E"/></marker><marker id="hEF4444" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EF4444"/></marker><marker id="hbfb9b0" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#bfb9b0"/></marker><marker id="h7d7870" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#7d7870"/></marker><marker id="hf5f2ec" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#f5f2ec"/></marker></defs>
  <rect width="690" height="300" fill="#0b0a0a"/>
  <text x="40" y="34" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start" opacity="1">When the table has two dimensions</text>
  <text x="650" y="34" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="end" opacity="1">the only change is where a cell looks</text>
  <rect x="74" y="90" width="62" height="46" rx="6" fill="rgba(167,139,250,0.14)" stroke="rgba(167,139,250,0.75)" stroke-width="1.3"/>
  <text x="105" y="117.5" fill="#A78BFA" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" opacity="1">diag</text>
  <rect x="170" y="90" width="62" height="46" rx="6" fill="rgba(255,95,162,0.14)" stroke="rgba(255,95,162,0.75)" stroke-width="1.3"/>
  <text x="201" y="117.5" fill="#FF5FA2" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" opacity="1">up</text>
  <rect x="74" y="170" width="62" height="46" rx="6" fill="rgba(234,179,8,0.14)" stroke="rgba(234,179,8,0.75)" stroke-width="1.3"/>
  <text x="105" y="197.5" fill="#EAB308" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" opacity="1">left</text>
  <rect x="170" y="170" width="62" height="46" rx="6" fill="rgba(91,140,255,0.14)" stroke="rgba(91,140,255,0.75)" stroke-width="1.3"/>
  <text x="201" y="197.5" fill="#5B8CFF" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" opacity="1">i, j</text>
  <path d="M136,136 L174,174" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#hA78BFA)"/>
  <path d="M201,136 L201,166" fill="none" stroke="#FF5FA2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#hFF5FA2)"/>
  <path d="M136,193 L166,193" fill="none" stroke="#EAB308" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#hEAB308)"/>
  <rect x="300" y="68" width="350" height="96" rx="12" fill="#0b0a0a" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="318" y="93" fill="#22C55E" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" opacity="1">characters match</text>
  <text x="318" y="112" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">take the diagonal and add one</text>
  <text x="320" y="138" fill="#22C55E" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" opacity="1">t[i][j] = t[i-1][j-1] + 1</text>
  <rect x="300" y="176" width="350" height="96" rx="12" fill="#0b0a0a" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="318" y="201" fill="#EF4444" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" opacity="1">they do not match</text>
  <text x="318" y="220" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">take the best neighbour you already have</text>
  <text x="320" y="246" fill="#EF4444" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" opacity="1">t[i][j] = max(t[i-1][j], t[i][j-1])</text>
  <text x="40" y="284" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1">Same ritual: fill in order, then walk back from the far corner.</text>
</svg>
