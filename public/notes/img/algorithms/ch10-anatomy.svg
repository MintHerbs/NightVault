  <text x="36" y="344" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Degree is how many children a node has. In a binary tree that is 0, 1 or 2, never more.</text>
  <text x="36" y="363" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Level is the same number as depth. The tree above has three levels, 0 to 2.</text>
