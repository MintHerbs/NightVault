  <text x="36" y="338" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">A new key is always inserted as a leaf. Nothing already in the tree ever moves.</text>
  <text x="36" y="358" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">So the insertion order decides the shape, and the shape decides the cost.</text>
