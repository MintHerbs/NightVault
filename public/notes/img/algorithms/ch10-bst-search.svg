  <text x="128" y="285" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">minimum:</text>
  <text x="128" y="298" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">go left until you cannot</text>
  <path d="M512,271 L512,243" fill="none" stroke="#EAB308" stroke-width="1.5" stroke-linecap="round" marker-end="url(#hEAB308)"/>
  <text x="654" y="285" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">maximum:</text>
  <text x="654" y="298" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="end">go right until you cannot</text>
  <text x="36" y="340" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Each comparison throws away a whole subtree. That is why a search tree is worth building.</text>
