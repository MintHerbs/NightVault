  <text x="36" y="356" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">Sorted input is the worst case, and it is the input that turns up most often in practice.</text>
  <text x="36" y="374" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Self balancing trees, AVL and red black, exist to stop the right hand picture happening.</text>
