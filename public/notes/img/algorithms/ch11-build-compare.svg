  <text x="36" y="316" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">Both are correct heaps. A heap is not unique, so two methods giving different arrays is not a mistake.</text>
  <text x="36" y="336" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Bottom up wins because most nodes are near the bottom and have almost nowhere to sink.</text>
