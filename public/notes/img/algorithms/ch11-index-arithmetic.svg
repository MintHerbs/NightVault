  <circle cx="145" cy="242" r="17" fill="rgba(45,212,191,0.28)" stroke="#2DD4BF" stroke-width="2.1" opacity="1"/>
  <text x="145" y="246.3" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="145" y="220" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">7</text>
  <circle cx="440" cy="104" r="9" fill="rgba(255,95,162,0.2)" stroke="#FF5FA2" stroke-width="1.5"/>
  <text x="440" y="107.4" fill="#FF5FA2" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">3</text>
  <text x="458" y="102" fill="#FF5FA2" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="start">i</text>
  <text x="458" y="116" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">the node we are standing on</text>
  <circle cx="440" cy="148" r="9" fill="rgba(234,179,8,0.2)" stroke="#EAB308" stroke-width="1.5"/>
  <text x="440" y="151.4" fill="#EAB308" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">1</text>
  <text x="458" y="146" fill="#EAB308" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="start">parent(i) = (i − 1) ÷ 2</text>
  <text x="458" y="160" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">= (3 − 1) ÷ 2 = 1</text>
  <circle cx="440" cy="192" r="9" fill="rgba(45,212,191,0.2)" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="440" y="195.4" fill="#2DD4BF" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">7</text>
  <text x="458" y="190" fill="#2DD4BF" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="start">left(i) = 2i + 1</text>
  <text x="458" y="204" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">= 2×3 + 1 = 7, which is a real node</text>
  <circle cx="440" cy="236" r="9" fill="rgba(239,68,68,0.2)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="440" y="239.4" fill="#EF4444" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">8</text>
  <text x="458" y="234" fill="#EF4444" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="start">right(i) = 2i + 2</text>
  <text x="458" y="248" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">= 8, but n = 8, so there is no right child</text>
  <text x="36" y="298" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">Integer division, so it rounds down. The root has no parent, and a child index is a real node only while it is &lt; n.</text>
  <text x="36" y="318" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Numbering from 1 instead: parent(i) = i ÷ 2, left(i) = 2i, right(i) = 2i + 1. Some courses do. Check yours once.</text>
  <text x="36" y="338" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Indices 4 to 7 have no children at all, so half the array is leaves.</text>
</svg>
