<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 428" width="690" height="428" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="An ordinary queue beside a priority queue, showing which element leaves next">
  <defs><marker id="hEAB308" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EAB308"/></marker><marker id="h5B8CFF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#5B8CFF"/></marker><marker id="h22C55E" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#22C55E"/></marker><marker id="hFF5FA2" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#FF5FA2"/></marker><marker id="hA78BFA" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#A78BFA"/></marker><marker id="hEF4444" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EF4444"/></marker><marker id="h2DD4BF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#2DD4BF"/></marker><marker id="hbfb9b0" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#bfb9b0"/></marker><marker id="h7d7870" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#7d7870"/></marker><marker id="hf5f2ec" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#f5f2ec"/></marker></defs>
  <rect width="690" height="428" fill="#0b0a0a"/>
  <text x="36" y="30" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">What a priority queue has to do, and what it costs</text>
  <rect x="36" y="52" width="618" height="154" rx="12" fill="#0b0a0a" stroke="rgba(125,120,112,0.3)" stroke-width="1"/>
  <text x="52" y="75" fill="#7d7870" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">an ordinary queue</text>
  <text x="52" y="92" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">first in, first out</text>
  <rect x="60" y="114" width="46" height="34" rx="7" fill="rgba(125,120,112,0.28)" stroke="#7d7870" stroke-width="2"/>
  <text x="83" y="136" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">A</text>
  <rect x="114" y="114" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="137" y="136" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">B</text>
  <rect x="168" y="114" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="191" y="136" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">C</text>
  <rect x="222" y="114" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="245" y="136" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">D</text>
  <rect x="276" y="114" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="299" y="136" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">E</text>
  <path d="M83,176 L83,154" fill="none" stroke="#7d7870" stroke-width="1.6" stroke-linecap="round" marker-end="url(#h7d7870)"/>
  <text x="83" y="190" fill="#7d7870" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">leaves next</text>
  <text x="344" y="136" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">position decides who leaves next</text>
  <rect x="36" y="216" width="618" height="154" rx="12" fill="#0b0a0a" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
  <text x="52" y="239" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">a priority queue</text>
  <text x="52" y="256" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">highest priority, first out</text>
  <rect x="60" y="278" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="83" y="300" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
  <rect x="114" y="278" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="137" y="300" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">9</text>
  <rect x="168" y="278" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="191" y="300" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
  <rect x="222" y="278" width="46" height="34" rx="7" fill="rgba(234,179,8,0.28)" stroke="#EAB308" stroke-width="2"/>
  <text x="245" y="300" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">25</text>
  <rect x="276" y="278" width="46" height="34" rx="7" fill="rgba(125,120,112,0.1)" stroke="#7d7870" stroke-width="1.3"/>
  <text x="299" y="300" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">7</text>
  <path d="M245,340 L245,318" fill="none" stroke="#EAB308" stroke-width="1.6" stroke-linecap="round" marker-end="url(#hEAB308)"/>
  <text x="245" y="354" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">leaves next</text>
  <text x="344" y="300" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">value decides who leaves next, whatever the order of arrival</text>
  <text x="36" y="390" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">A heap gives insert and remove-highest in O(log n) each, and finding the highest in O(1).</text>
  <text x="36" y="410" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">A sorted array reads the top in O(1) but pays O(n) to insert. An unsorted one is the other way round.</text>
</svg>
