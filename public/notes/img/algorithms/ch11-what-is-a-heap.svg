  <text x="36" y="312" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">The rule is about a node and its own children only. Left and right are not ordered against each other.</text>
  <text x="36" y="332" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">That is the whole difference from a search tree, and it is why a heap is cheap to keep correct.</text>
