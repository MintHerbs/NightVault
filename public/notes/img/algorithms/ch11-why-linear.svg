  <text x="438" y="254" fill="#22C55E" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">8 nodes, each cannot sink at all</text>
  <text x="36" y="262" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">Half the nodes are leaves and do no work at all. A quarter can move one level. The expensive nodes are the rare ones.</text>
  <text x="36" y="282" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Adding it up gives a total under 2n, so the build is linear.</text>
  <text x="36" y="302" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Top down is the other way round: every new value enters at the bottom, where the climb is longest.</text>
