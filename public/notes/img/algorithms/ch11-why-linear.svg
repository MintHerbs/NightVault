  <text x="438" y="104" fill="#EF4444" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">1 node, each can sink 3</text>
  <circle cx="422" cy="150" r="7" fill="rgba(255,95,162,0.25)" stroke="#FF5FA2" stroke-width="1.5"/>
  <text x="438" y="154" fill="#FF5FA2" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">2 nodes, each can sink 2</text>
  <circle cx="422" cy="200" r="7" fill="rgba(91,140,255,0.25)" stroke="#5B8CFF" stroke-width="1.5"/>
  <text x="438" y="204" fill="#5B8CFF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">4 nodes, each can sink 1</text>
