  <text x="36" y="250" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">Linear probing fills the slot next door, so runs merge into longer runs, and a longer run is a bigger target.</text>
  <text x="36" y="270" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Double hashing gives each key its own step size, so two keys that collide once do not collide again.</text>
