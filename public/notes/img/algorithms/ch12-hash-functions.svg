<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 508" width="690" height="508" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The division, mid-square, multiplicative and folding hash functions worked on one key">
  <defs><marker id="hFF5FA2" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#FF5FA2"/></marker><marker id="h22C55E" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#22C55E"/></marker><marker id="hEF4444" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EF4444"/></marker><marker id="hA78BFA" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#A78BFA"/></marker><marker id="h2DD4BF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#2DD4BF"/></marker><marker id="hEAB308" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EAB308"/></marker><marker id="hbfb9b0" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#bfb9b0"/></marker><marker id="h7d7870" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#7d7870"/></marker><marker id="hf5f2ec" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#f5f2ec"/></marker></defs>
  <rect width="690" height="508" fill="#0b0a0a"/>
  <text x="36" y="30" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Four ways to turn a key into an index, on k = 27, m = 11</text>
  <rect x="36" y="52" width="618" height="92" rx="12" fill="#0b0a0a" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
  <text x="52" y="75" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">division</text>
  
  <text x="56" y="96" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">how many whole 11s fit into 27?  2, because 2 × 11 = 22</text>
  <text x="56" y="111" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">what is left over?  27 − 22 = 5</text>
  <text x="56" y="126" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start">so h(27) = 5</text>
  <rect x="572" y="80" width="60" height="38" rx="8" fill="rgba(234,179,8,0.2)" stroke="#EAB308" stroke-width="1.6"/>
  <text x="602" y="105" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">5</text>
  <text x="602" y="74" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">index</text>
  <rect x="36" y="152" width="618" height="92" rx="12" fill="#0b0a0a" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
  <text x="52" y="175" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">mid-square</text>
  
  <text x="56" y="196" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">square the key:  27 × 27 = 729</text>
  <text x="56" y="211" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">take the middle 2 digits of 729:  72</text>
  <text x="56" y="226" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start">reduce into the table:  72 mod 11 = 6</text>
  <rect x="572" y="180" width="60" height="38" rx="8" fill="rgba(234,179,8,0.2)" stroke="#EAB308" stroke-width="1.6"/>
  <text x="602" y="205" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">6</text>
  <text x="602" y="174" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">index</text>
  <rect x="36" y="252" width="618" height="92" rx="12" fill="#0b0a0a" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
  <text x="52" y="275" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">multiplicative</text>
  
  <text x="56" y="296" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">multiply by A:  27 × 0.6180339887 = 16.686918</text>
  <text x="56" y="311" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">keep only the part after the point:  0.686918</text>
  <text x="56" y="326" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">scale to the table:  0.686918 × 11 = 7.5561</text>
  <text x="56" y="341" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start">take the floor:  h(27) = 7</text>
  <rect x="572" y="280" width="60" height="38" rx="8" fill="rgba(234,179,8,0.2)" stroke="#EAB308" stroke-width="1.6"/>
  <text x="602" y="305" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">7</text>
  <text x="602" y="274" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">index</text>
  <rect x="36" y="352" width="618" height="92" rx="12" fill="#0b0a0a" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
  <text x="52" y="375" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">folding</text>
  
  <text x="56" y="396" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">split 27 into groups of 2:  27</text>
  <text x="56" y="411" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">add them:  27 = 27</text>
  <text x="56" y="426" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start">reduce into the table:  27 mod 11 = 5</text>
  <rect x="572" y="380" width="60" height="38" rx="8" fill="rgba(234,179,8,0.2)" stroke="#EAB308" stroke-width="1.6"/>
  <text x="602" y="405" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">5</text>
  <text x="602" y="374" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">index</text>
  <text x="36" y="482" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">Different functions, different answers, all valid. What matters is that a function spreads keys evenly and is cheap.</text>
  <text x="36" y="500" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Division is the one exams ask for. Choose m prime, and never a power of 2, or only the low bits of the key are used.</text>
</svg>
