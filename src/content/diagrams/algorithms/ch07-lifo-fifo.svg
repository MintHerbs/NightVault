    @keyframes k-cap2{0%{opacity:0;translate:0px 0px}14%{opacity:0;translate:0px 0px}16.8%{opacity:1;translate:0px 0px}24%{opacity:1;translate:0px 0px}26.8%{opacity:0;translate:0px 0px}100%{opacity:0;translate:0px 0px}}
    @keyframes k-cap3{0%{opacity:0;translate:0px 0px}24%{opacity:0;translate:0px 0px}26.8%{opacity:1;translate:0px 0px}37.8%{opacity:1;translate:0px 0px}40.6%{opacity:0;translate:0px 0px}100%{opacity:0;translate:0px 0px}}
    @keyframes k-cap4{0%{opacity:0;translate:0px 0px}37.8%{opacity:0;translate:0px 0px}40.6%{opacity:1;translate:0px 0px}50.9%{opacity:1;translate:0px 0px}53.7%{opacity:0;translate:0px 0px}100%{opacity:0;translate:0px 0px}}
