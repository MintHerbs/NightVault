    @keyframes k-sb{0%{opacity:0;translate:0px -78px}15.4%{opacity:0;translate:0px -78px}18.6%{opacity:1;translate:0px 0px}52.3%{opacity:1;translate:0px 0px}55.5%{opacity:0;translate:0px -78px}100%{opacity:0;translate:0px -78px}}
    @keyframes k-sc{0%{opacity:0;translate:0px -78px}25.4%{opacity:0;translate:0px -78px}28.6%{opacity:1;translate:0px 0px}39.2%{opacity:1;translate:0px 0px}42.5%{opacity:0;translate:0px -78px}100%{opacity:0;translate:0px -78px}}
    @keyframes k-qa{0%{opacity:0;translate:60px 0px}5.4%{opacity:0;translate:60px 0px}8.6%{opacity:1;translate:0px 0px}39.2%{opacity:1;translate:0px 0px}42.5%{opacity:0;translate:-106px 0px}100%{opacity:0;translate:60px 0px}}
    @keyframes k-qb{0%{opacity:0;translate:60px 0px}15.4%{opacity:0;translate:60px 0px}18.6%{opacity:1;translate:0px 0px}39.2%{opacity:1;translate:0px 0px}42.5%{opacity:1;translate:-60px 0px}52.3%{opacity:1;translate:-60px 0px}55.5%{opacity:0;translate:-166px 0px}100%{opacity:0;translate:60px 0px}}
