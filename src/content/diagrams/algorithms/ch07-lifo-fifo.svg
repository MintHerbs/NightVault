    @keyframes k-cap6{0%{opacity:0;translate:0px 0px}63.2%{opacity:0;translate:0px 0px}66%{opacity:1;translate:0px 0px}81.7%{opacity:1;translate:0px 0px}84.5%{opacity:0;translate:0px 0px}100%{opacity:0;translate:0px 0px}}
