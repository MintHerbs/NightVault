      .k-sa{animation:none}
      .k-sb{animation:none}
      .k-sc{animation:none}
      .k-qa{animation:none}
      .k-qb{animation:none}
      .k-qc{animation:none}
      .k-cap0{animation:none}
      .k-cap1{animation:none}
      .k-cap2{animation:none}
      .k-cap3{animation:none}
      .k-cap4{animation:none}
      .k-cap5{animation:none}
      .k-cap6{animation:none}
      .k-cap7{animation:none}
      .k-cap1,.k-cap2,.k-cap3,.k-cap4,.k-cap5,.k-cap6,.k-cap7{display:none}
