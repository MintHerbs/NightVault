<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 330" width="690" height="330" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="An animation of A, B and C entering a stack and a queue in that order. The stack gives back C then B, the queue gives back A then B.">
  <defs><marker id="head-5B8CFF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5B8CFF"/></marker><marker id="head-2DD4BF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2DD4BF"/></marker></defs>
  <style>
    .k-sa{animation:k-sa 13s linear infinite}
    .k-sb{animation:k-sb 13s linear infinite}
    .k-sc{animation:k-sc 13s linear infinite}
    .k-qa{animation:k-qa 13s linear infinite}
    .k-qb{animation:k-qb 13s linear infinite}
    .k-qc{animation:k-qc 13s linear infinite}
    .k-cap0{animation:k-cap0 13s linear infinite}
    .k-cap1{animation:k-cap1 13s linear infinite}
    .k-cap2{animation:k-cap2 13s linear infinite}
    .k-cap3{animation:k-cap3 13s linear infinite}
    .k-cap4{animation:k-cap4 13s linear infinite}
    .k-cap5{animation:k-cap5 13s linear infinite}
    .k-cap6{animation:k-cap6 13s linear infinite}
    .k-cap7{animation:k-cap7 13s linear infinite}
