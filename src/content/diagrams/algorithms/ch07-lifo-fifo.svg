  <g class="k-cap1" opacity="0"><text x="175" y="292" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">push A</text><text x="511" y="292" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">enqueue A</text></g>
