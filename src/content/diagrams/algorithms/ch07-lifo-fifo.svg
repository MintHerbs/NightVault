  <g class="k-qb" transform="translate(484,158)"><rect x="0" y="0" width="54" height="42" rx="7" fill="rgba(45,212,191,0.16)" stroke="#2DD4BF" stroke-width="1.4"/><text x="27" y="26.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">B</text></g>
