  <text x="345" y="30" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">Both steps are one move each, so it costs the same whether the list holds ten nodes or ten million.</text>
