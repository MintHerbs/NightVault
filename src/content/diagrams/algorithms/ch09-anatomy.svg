defs>
  <rect width="690" height="352" fill="#0b0a0a"/>
  <text x="40" y="34" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start" opacity="1">Every one of these questions has this shape</text>
  <rect x="40" y="56" width="610" height="128" rx="12" fill="rgba(245,242,236,0.02)" stroke="rgba(125,120,112,0.5)" stroke-width="1"/>
  <text x="70" y="100" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">lds(</text>
  <text x="106.2" y="100" fill="#5B8CFF" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">i</text>
  <text x="115.3" y="100" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">) = </text>
  <text x="151.4" y="100" fill="#2DD4BF" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">1</text>
  <text x="160.5" y="100" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1"> + </text>
  <text x="187.7" y="100" fill="#EAB308" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">max( lds(</text>
  <text x="269.1" y="100" fill="#FF5FA2" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">j</text>
  <text x="278.2" y="100" fill="#EAB308" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">) )</text>
  <text x="70" y="134" fill="#A78BFA" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="start" opacity="1">where  i &gt; j &gt;= 0  and  array[j] &gt; array[i]</text>
  <text x="70" y="166" fill="#2DD4BF" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" opacity="1">1</text>
  <text x="93.5" y="166" fill="#2DD4BF" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="start" opacity="1">if no such j exists</text>
  <circle cx="156" cy="78" r="8" fill="rgba(45,212,191,0.2)" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="156" y="81.6" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">1</text>
  <circle cx="228.4" cy="78" r="8" fill="rgba(234,179,8,0.2)" stroke="#EAB308" stroke-width="1.2"/>
  <text x="228.4" y="81.6" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">2</text>
  <circle cx="249.3" cy="112" r="8" fill="rgba(167,139,250,0.2)" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="249.3" y="115.6" fill="#A78BFA" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">3</text>
  <circle cx="74.5" cy="144" r="8" fill="rgba(45,212,191,0.2)" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="74.5" y="147.6" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">4</text>
  <circle cx="52" cy="214" r="8" fill="rgba(45,212,191,0.2)" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="52" y="217.6" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">1</text>
  <text x="70" y="218" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" opacity="1">the element itself</text>
  <text x="230" y="218" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1">every element is a run of length one on its own, so a cell is never zero</text>
  <circle cx="52" cy="241" r="8" fill="rgba(234,179,8,0.2)" stroke="#EAB308" stroke-width="1.2"/>
  <text x="52" y="244.6" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">2</text>
  <text x="70" y="245" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" opacity="1">the best already found</text>
  <text x="230" y="245" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1">you never recompute anything, you read it off a cell to the left</text>
  <circle cx="52" cy="268" r="8" fill="rgba(167,139,250,0.2)" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="52" y="271.6" fill="#A78BFA" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">3</text>
  <text x="70" y="272" fill="#A78BFA" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" opacity="1">the condition</text>
  <text x="230" y="272" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1">the only line that differs between increasing, decreasing and the rest</text>
  <circle cx="52" cy="295" r="8" fill="rgba(45,212,191,0.2)" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="52" y="298.6" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity="1">4</text>
  <text x="70" y="299" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" opacity="1">nothing qualifies</text>
  <text x="230" y="299" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1">no element to the left can come first, so the entry is just 1</text>
  <text x="40" y="336" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" opacity="1">Change line 3 and you have a different question. Everything else stays put.</text>
</svg>
