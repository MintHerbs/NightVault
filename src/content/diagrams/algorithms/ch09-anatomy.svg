<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 352" width="690" height="352" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The anatomy of a subsequence recurrence, with each part numbered and explained">
