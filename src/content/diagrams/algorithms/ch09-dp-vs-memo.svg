<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 374" width="690" height="374" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="A bottom up table beside a memoised recursion, with what each is good for">
  <defs><marker id="h5B8CFF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#5B8CFF"/></marker><marker id="hFF5FA2" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#FF5FA2"/></marker><marker id="hA78BFA" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#A78BFA"/></marker><marker id="hEAB308" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EAB308"/></marker><marker id="h2DD4BF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#2DD4BF"/></marker><marker id="h22C55E" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#22C55E"/></marker><marker id="hEF4444" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EF4444"/></marker><marker id="hbfb9b0" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#bfb9b0"/></marker><marker id="h7d7870" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#7d7870"/></marker><marker id="hf5f2ec" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#f5f2ec"/></marker></defs>
  <rect width="690" height="374" fill="#0b0a0a"/>
  <text x="40" y="34" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start" opacity="1">Two ways to avoid the repeated work</text>
  <rect x="40" y="60" width="296" height="252" rx="12" fill="#0b0a0a" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="58" y="85" fill="#22C55E" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" opacity="1">bottom up, a table</text>
  <text x="58" y="104" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">start small, work up, never recurse</text>
  <rect x="62" y="132" width="34" height="28" rx="6" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.75)" stroke-width="1.3"/><text x="79" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" opacity="1">0</text>
  <rect x="100" y="132" width="34" height="28" rx="6" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.75)" stroke-width="1.3"/><text x="117" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" opacity="1">1</text>
  <rect x="138" y="132" width="34" height="28" rx="6" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.75)" stroke-width="1.3"/><text x="155" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" opacity="1">1</text>
  <rect x="176" y="132" width="34" height="28" rx="6" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.75)" stroke-width="1.3"/><text x="193" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" opacity="1">2</text>
  <rect x="214" y="132" width="34" height="28" rx="6" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.75)" stroke-width="1.3"/><text x="231" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" opacity="1">3</text>
  <rect x="252" y="132" width="34" height="28" rx="6" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.75)" stroke-width="1.3"/><text x="269" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" opacity="1">5</text>
  <rect x="290" y="132" width="34" height="28" rx="6" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.75)" stroke-width="1.3"/><text x="307" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" opacity="1">8</text>
  <path d="M62,176 L324,176" fill="none" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#h22C55E)"/>
  <text x="180" y="194" fill="#22C55E" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" opacity="1">one pass, no stack</text>
  <text x="62" y="236" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">- every cell is computed, in order</text>
  <text x="62" y="255" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">- no recursion, so no stack depth limit</text>
  <text x="62" y="274" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">- best when you need most of the table</text>
  <rect x="354" y="60" width="296" height="252" rx="12" fill="#0b0a0a" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="372" y="85" fill="#A78BFA" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" opacity="1">top down, memoisation</text>
  <text x="372" y="104" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">recurse, but write answers down</text>
  <path d="M502,146 L444,166" stroke="rgba(125,120,112,0.6)" stroke-width="1.2"/>
  <path d="M502,146 L560,166" stroke="rgba(125,120,112,0.6)" stroke-width="1.2"/>
  <circle cx="502" cy="132" r="14" fill="rgba(167,139,250,0.18)" stroke="rgba(167,139,250,0.85)" stroke-width="1.3"/>
  <text x="502" y="136.5" fill="#A78BFA" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" opacity="1">5</text>
  <circle cx="444" cy="180" r="14" fill="rgba(167,139,250,0.18)" stroke="rgba(167,139,250,0.85)" stroke-width="1.3"/>
  <text x="444" y="184.5" fill="#A78BFA" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" opacity="1">4</text>
  <circle cx="560" cy="180" r="14" fill="rgba(234,179,8,0.18)" stroke="rgba(234,179,8,0.85)" stroke-width="1.3"/>
  <text x="560" y="184.5" fill="#EAB308" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" opacity="1">3</text>
  <text x="502" y="216" fill="#EAB308" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" opacity="1">fib(4) already worked fib(3) out, so this one is read off</text>
  <text x="376" y="236" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">- only the cells you actually reach</text>
  <text x="376" y="255" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">- recursion, so the stack can run deep</text>
  <text x="376" y="274" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" opacity="1">- best when most of the table is never needed</text>
  <text x="40" y="338" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" opacity="1">Both are dynamic programming. Both turn exponential into linear.</text>
  <text x="40" y="360" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" opacity="1">Pick bottom up when every subproblem is needed anyway, which is exactly the case in a subsequence question.</text>
</svg>
