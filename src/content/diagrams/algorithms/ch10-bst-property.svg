  <path d="M578,204.6 L597,225.4" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
  <circle cx="524.5" cy="146" r="15" fill="rgba(125,120,112,0.14)" stroke="#7d7870" stroke-width="1.6" opacity="1"/>
  <text x="524.5" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">8</text>
  <circle cx="440.5" cy="192" r="15" fill="rgba(125,120,112,0.14)" stroke="#7d7870" stroke-width="1.6" opacity="1"/>
  <text x="440.5" y="196.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">3</text>
  <circle cx="398.5" cy="238" r="15" fill="rgba(125,120,112,0.14)" stroke="#7d7870" stroke-width="1.6" opacity="1"/>
  <text x="398.5" y="242.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">1</text>
  <circle cx="482.5" cy="238" r="15" fill="rgba(239,68,68,0.3)" stroke="#EF4444" stroke-width="2.2" opacity="1"/>
  <text x="482.5" y="242.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">9</text>
  <circle cx="566.5" cy="192" r="15" fill="rgba(125,120,112,0.14)" stroke="#7d7870" stroke-width="1.6" opacity="1"/>
  <text x="566.5" y="196.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">10</text>
  <circle cx="608.5" cy="238" r="15" fill="rgba(125,120,112,0.14)" stroke="#7d7870" stroke-width="1.6" opacity="1"/>
  <text x="608.5" y="242.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">14</text>
  <text x="369" y="268" fill="#EF4444" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start">in-order: 1, 3, 9, 8, 10, 14</text>
  <text x="369" y="287" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">not sorted. 9 is on the correct side of 3,</text>
  <text x="369" y="300" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">but it is in the left subtree of 8, and 9 &gt; 8</text>
  <text x="36" y="340" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start">The rule covers whole subtrees, not just the two children of a node.</text>
  <text x="36" y="360" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Quickest check in an exam: write the in-order traversal. Not sorted means not a search tree.</text>
</svg>
