<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 380" width="690" height="380" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="A binary search tree beside a binary tree that breaks the ordering rule">
  <defs><marker id="hEAB308" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EAB308"/></marker><marker id="h5B8CFF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#5B8CFF"/></marker><marker id="h22C55E" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#22C55E"/></marker><marker id="hFF5FA2" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#FF5FA2"/></marker><marker id="hA78BFA" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#A78BFA"/></marker><marker id="hEF4444" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EF4444"/></marker><marker id="h2DD4BF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#2DD4BF"/></marker><marker id="hbfb9b0" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#bfb9b0"/></marker><marker id="h7d7870" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#7d7870"/></marker><marker id="hf5f2ec" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#f5f2ec"/></marker></defs>
  <rect width="690" height="380" fill="#0b0a0a"/>
  <text x="36" y="32" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">What makes a binary tree a search tree</text>
  <rect x="36" y="62" width="301" height="252" rx="12" fill="#0b0a0a" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="52" y="85" fill="#22C55E" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">a binary search tree</text>
  <text x="52" y="102" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">left &lt; node &lt; right, everywhere</text>
  <path d="M192.6,154.2 L138.4,183.8" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
  <path d="M219,158.6 L238,179.4" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
  <path d="M112,204.6 L93,225.4" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
  <path d="M135,204.6 L154,225.4" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
  <path d="M261,204.6 L280,225.4" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
  <circle cx="207.5" cy="146" r="15" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.6" opacity="1"/>
  <text x="207.5" y="150.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">8</text>
  <circle cx="123.5" cy="192" r="15" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.6" opacity="1"/>
  <text x="123.5" y="196.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">3</text>
  <circle cx="81.5" cy="238" r="15" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.6" opacity="1"/>
  <text x="81.5" y="242.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">1</text>
  <circle cx="165.5" cy="238" r="15" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.6" opacity="1"/>
  <text x="165.5" y="242.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">6</text>
  <circle cx="249.5" cy="192" r="15" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.6" opacity="1"/>
  <text x="249.5" y="196.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">10</text>
  <circle cx="291.5" cy="238" r="15" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.6" opacity="1"/>
  <text x="291.5" y="242.1" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">14</text>
  <text x="52" y="268" fill="#22C55E" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start">in-order: 1, 3, 6, 8, 10, 14</text>
  <text x="52" y="288" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">sorted, so the ordering holds everywhere</text>
  <rect x="353" y="62" width="301" height="252" rx="12" fill="#0b0a0a" stroke="rgba(125,120,112,0.3)" stroke-width="1"/>
  <text x="369" y="85" fill="#7d7870" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="start">not a search tree</text>
  <text x="369" y="102" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start">one value sits on the wrong side</text>
  <path d="M509.6,154.2 L455.4,183.8" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
  <path d="M536,158.6 L555,179.4" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="1"/>
