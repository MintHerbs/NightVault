<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 336" width="690" height="336" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="An animation deleting the root of a binary search tree using its in-order successor">
  <defs><marker id="hEAB308" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EAB308"/></marker><marker id="h5B8CFF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#5B8CFF"/></marker><marker id="h22C55E" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#22C55E"/></marker><marker id="hFF5FA2" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#FF5FA2"/></marker><marker id="hA78BFA" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#A78BFA"/></marker><marker id="hEF4444" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#EF4444"/></marker><marker id="h2DD4BF" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#2DD4BF"/></marker><marker id="hbfb9b0" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#bfb9b0"/></marker><marker id="h7d7870" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#7d7870"/></marker><marker id="hf5f2ec" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6,0.6 L9.4,4 L0.6,7.4 z" fill="#f5f2ec"/></marker></defs>
  <rect width="690" height="336" fill="#0b0a0a"/>
  <text x="36" y="32" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start">Deleting the root</text>
  <text x="654" y="32" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="end">the root is not a special case</text>
  <path d="M329.7,109.2 L262.3,152.8" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="0.55"/>
  <path d="M358.3,109.2 L425.7,152.8" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="0.55"/>
  <path d="M237.6,175.4 L210.4,210.6" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="0.55"/>
  <path d="M258.4,175.4 L285.6,210.6" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="0.55"/>
  <path d="M429.6,175.4 L402.4,210.6" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="0.55"/>
  <path d="M450.4,175.4 L477.6,210.6" stroke="rgba(125,120,112,0.75)" stroke-width="1.4" opacity="0.55"/>
  <circle cx="344" cy="100" r="17" fill="rgba(234,179,8,0.06)" stroke="#EAB308" stroke-width="1.6" opacity="0.55"/>
  <text x="344" y="104.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">50</text>
  <circle cx="248" cy="162" r="17" fill="rgba(91,140,255,0.06)" stroke="#5B8CFF" stroke-width="1.6" opacity="0.55"/>
  <text x="248" y="166.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">30</text>
  <circle cx="200" cy="224" r="17" fill="rgba(34,197,94,0.06)" stroke="#22C55E" stroke-width="1.6" opacity="0.55"/>
  <text x="200" y="228.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">20</text>
  <circle cx="296" cy="224" r="17" fill="rgba(34,197,94,0.06)" stroke="#22C55E" stroke-width="1.6" opacity="0.55"/>
  <text x="296" y="228.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">40</text>
  <circle cx="440" cy="162" r="17" fill="rgba(91,140,255,0.06)" stroke="#5B8CFF" stroke-width="1.6" opacity="0.55"/>
  <text x="440" y="166.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">70</text>
  <circle cx="392" cy="224" r="17" fill="rgba(34,197,94,0.06)" stroke="#22C55E" stroke-width="1.6" opacity="0.55"/>
  <text x="392" y="228.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">60</text>
  <circle cx="488" cy="224" r="17" fill="rgba(34,197,94,0.06)" stroke="#22C55E" stroke-width="1.6" opacity="0.55"/>
  <text x="488" y="228.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">80</text>
  <g class="cap" style="animation:cap0 9.5s linear infinite;opacity:1"><text x="36" y="290" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">1. The root has two children, so case 3 applies.</text></g>
  <g class="cap" style="animation:cap1 9.5s linear infinite;opacity:0"><text x="36" y="290" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">2. Go right once to 70, then left as far as possible: the in-order successor is 60.</text></g>
  <g class="cap" style="animation:cap2 9.5s linear infinite;opacity:0"><text x="36" y="290" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">3. Copy 60 into the root. The ordering still holds: everything left is smaller, everything right is larger.</text></g>
  <g class="cap" style="animation:cap3 9.5s linear infinite;opacity:0"><text x="36" y="290" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">4. Now delete the old 60 from the right subtree. It was a leaf, so that is case 1.</text></g>
  <g style="animation:r1 9.5s linear infinite;opacity:0"><circle cx="344" cy="100" r="17" fill="rgba(239,68,68,0.3)" stroke="#EF4444" stroke-width="2.2"/><text x="344" y="104.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">50</text></g>
  <g style="animation:r2 9.5s linear infinite;opacity:0"><path d="M356,112 L432,150" fill="none" stroke="#FF5FA2" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hFF5FA2)"/><path d="M430,174 L398,212" fill="none" stroke="#FF5FA2" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hFF5FA2)"/><circle cx="392" cy="224" r="17" fill="rgba(45,212,191,0.3)" stroke="#2DD4BF" stroke-width="2.2"/><text x="392" y="228.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">60</text><text x="392" y="259" fill="#2DD4BF" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">in-order successor</text></g>
  <g style="animation:r3 9.5s linear infinite;opacity:0"><circle cx="344" cy="100" r="17" fill="rgba(45,212,191,0.3)" stroke="#2DD4BF" stroke-width="2.2"/><text x="344" y="104.5" fill="#f5f2ec" font-family="Cascadia Code, Fira Code, JetBrains Mono, SF Mono, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">60</text></g>
  <g style="animation:r4 9.5s linear infinite;opacity:0"><circle cx="392" cy="224" r="17" fill="#0b0a0a" stroke="rgba(239,68,68,0.6)" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M384,216 L400,232 M400,216 L384,232" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/></g>
  <text x="36" y="318" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">The root is not a special case. The only difference is that the tree variable itself is reassigned.</text>
</svg>
