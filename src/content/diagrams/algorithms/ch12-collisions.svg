  <text x="36" y="214" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">9 keys into 11 slots. Three land on 0, two on 2 and two on 9.</text>
  <text x="36" y="234" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">With more keys than slots a collision is certain, and long before that it is overwhelmingly likely.</text>
  <text x="36" y="254" fill="#EF4444" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">So a hash table is a hash function plus a plan for collisions. There is no third option.</text>
