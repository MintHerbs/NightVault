  <text x="636" y="132" fill="#EF4444" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="start">linear probing</text>
  <text x="144" y="229" fill="rgba(125,120,112,0.95)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9" font-weight="600" text-anchor="middle">0.1</text>
  <text x="225" y="229" fill="rgba(125,120,112,0.95)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9" font-weight="600" text-anchor="middle">0.25</text>
  <text x="360" y="229" fill="rgba(125,120,112,0.95)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9" font-weight="600" text-anchor="middle">0.5</text>
  <text x="495" y="229" fill="rgba(125,120,112,0.95)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9" font-weight="600" text-anchor="middle">0.75</text>
  <text x="576" y="229" fill="rgba(125,120,112,0.95)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9" font-weight="600" text-anchor="middle">0.9</text>
  <text x="603" y="229" fill="rgba(125,120,112,0.95)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9" font-weight="600" text-anchor="middle">0.95</text>
  <text x="360" y="246" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">load factor α</text>
  <text x="36" y="268" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">Chaining degrades gently and keeps working past α = 1. Open addressing falls off a cliff as the table fills.</text>
  <text x="36" y="288" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">That is why an open addressed table is resized, usually doubling, once α passes about 0.7.</text>
  <text x="36" y="308" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">Resizing rehashes every key, because the index depends on m. It is O(n), but rare enough to average out to O(1).</text>
</svg>
