  <circle cx="225" cy="198.9" r="3" fill="#EF4444"/>
  <circle cx="360" cy="186.9" r="3" fill="#EF4444"/>
  <circle cx="495" cy="121.9" r="3" fill="#EF4444"/>
  <circle cx="576" cy="84" r="3" fill="#EF4444"/>
