  <path d="M144,202.6 L225,201.9 L360,200.5 L495,199.1 L576,198.3 L603,198" fill="none" stroke="#22C55E" stroke-width="2"/>
  <circle cx="144" cy="202.6" r="3" fill="#22C55E"/>
  <circle cx="225" cy="201.9" r="3" fill="#22C55E"/>
  <circle cx="360" cy="200.5" r="3" fill="#22C55E"/>
  <circle cx="495" cy="199.1" r="3" fill="#22C55E"/>
  <circle cx="576" cy="198.3" r="3" fill="#22C55E"/>
  <circle cx="603" cy="198" r="3" fill="#22C55E"/>
  <text x="636" y="98" fill="#22C55E" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="start">chaining</text>
