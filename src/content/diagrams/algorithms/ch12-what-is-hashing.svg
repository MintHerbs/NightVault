  <path d="M518,120 L345,162" fill="none" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round" marker-end="url(#h22C55E)"/>
  <text x="36" y="246" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">No searching, no comparisons, no tree to walk. One arithmetic operation gives the address.</text>
  <text x="36" y="266" fill="#bfb9b0" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="500" text-anchor="start">That is why insert, search and delete are all O(1) on average, which nothing in chapters 10 or 11 can do.</text>
  <text x="36" y="286" fill="#EF4444" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">The catch is that two keys can land on the same index, and the rest of the chapter is about that.</text>
