  <text x="36" y="286" fill="#f5f2ec" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="start">The mismatched character is 'C', which last occurs at index 4 of the pattern, so the shift is 8 − 4 = 4.</text>
