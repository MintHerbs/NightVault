<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 210" width="736" height="210" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="JSON round trip from a JavaScript object to a Python dict">
  <rect width="736" height="210" fill="#0b0d17"/>
  <defs>
    <marker id="ar10" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2703a"/>
    </marker>
    <marker id="ar10b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">the same data, three representations</text>

    <rect x="0" y="26" width="190" height="102" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="95" y="48" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">browser</text>
    <text x="95" y="65" fill="#5f6b7a" font-size="9" text-anchor="middle">JavaScript object</text>
    <text x="95" y="90" fill="#d6d8ea" font-size="10" text-anchor="middle">{ name: "Sarah" }</text>
    <text x="95" y="112" fill="#8fd694" font-size="9" text-anchor="middle">has properties</text>

    <rect x="255" y="26" width="190" height="102" rx="8" fill="#14162a" stroke="#f0b45e"/>
    <text x="350" y="48" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">the wire</text>
    <text x="350" y="65" fill="#5f6b7a" font-size="9" text-anchor="middle">JSON text</text>
    <text x="350" y="90" fill="#f0b45e" font-size="10" text-anchor="middle">{"name":"Sarah"}</text>
    <text x="350" y="112" fill="#f0b45e" font-size="9" text-anchor="middle">just characters</text>

    <rect x="510" y="26" width="190" height="102" rx="8" fill="#14162a" stroke="#7fb3ff"/>
    <text x="605" y="48" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">Django</text>
    <text x="605" y="65" fill="#5f6b7a" font-size="9" text-anchor="middle">Python dict</text>
    <text x="605" y="90" fill="#d6d8ea" font-size="10" text-anchor="middle">{'name': 'Sarah'}</text>
    <text x="605" y="112" fill="#7fb3ff" font-size="9" text-anchor="middle">has keys</text>

    <path d="M192,80 L248,80" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar10)"/>
    <text x="220" y="72" fill="#e2703a" font-size="9" text-anchor="middle">stringify</text>

    <path d="M447,80 L503,80" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar10)"/>
    <text x="475" y="72" fill="#e2703a" font-size="9" text-anchor="middle">parse</text>

    <path d="M605,138 L605,152 L95,152 L95,140" stroke="#5f6b7a" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#ar10b)"/>
    <text x="350" y="170" fill="#5f6b7a" font-size="9" text-anchor="middle">the response returns the same way: dict, then JSON text, then object</text>
  </g>
</svg>
