<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 250" width="736" height="250" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="A request travelling through urls, view, serializer, model and the database">
  <rect width="736" height="250" fill="#0b0d17"/>
  <defs>
    <marker id="ar11" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2703a"/>
    </marker>
    <marker id="ar11b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8fd694"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">POST /api/apply/  with a JSON body</text>

    <rect x="0" y="26" width="124" height="76" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="62" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">client</text>
    <text x="62" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">browser or app</text>
    <text x="62" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">sends JSON</text>

    <rect x="144" y="26" width="124" height="76" rx="8" fill="#14162a" stroke="#e2703a"/>
    <text x="206" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">urls.py</text>
    <text x="206" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">matches the path</text>
    <text x="206" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">picks the view</text>

    <rect x="288" y="26" width="124" height="76" rx="8" fill="#14162a" stroke="#e2703a"/>
    <text x="350" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">views.py</text>
    <text x="350" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">checks the method</text>
    <text x="350" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">request.data</text>

    <rect x="432" y="26" width="124" height="76" rx="8" fill="#14162a" stroke="#f0b45e"/>
    <text x="494" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">serializer</text>
    <text x="494" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">is_valid()</text>
    <text x="494" y="84" fill="#f0b45e" font-size="8" text-anchor="middle">validates</text>

    <rect x="576" y="26" width="124" height="76" rx="8" fill="#14162a" stroke="#7fb3ff"/>
    <text x="638" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">model + DB</text>
    <text x="638" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">the ORM</text>
    <text x="638" y="84" fill="#7fb3ff" font-size="8" text-anchor="middle">saves the row</text>

    <path d="M126,64 L140,64" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar11)"/>
    <path d="M270,64 L284,64" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar11)"/>
    <path d="M414,64 L428,64" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar11)"/>
    <path d="M558,64 L572,64" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar11)"/>

    <path d="M638,112 L638,132 L62,132 L62,106" stroke="#8fd694" stroke-width="1.5" fill="none" marker-end="url(#ar11b)"/>
    <text x="350" y="128" fill="#8fd694" font-size="9" text-anchor="middle">201 Created, plus the saved record as JSON</text>

    <rect x="432" y="152" width="268" height="58" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="566" y="172" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">if is_valid() fails</text>
    <text x="566" y="190" fill="#d6d8ea" font-size="9" text-anchor="middle">400, plus serializer.errors</text>
    <text x="566" y="204" fill="#5f6b7a" font-size="8" text-anchor="middle">nothing reaches the database</text>

    <path d="M494,106 L494,148" stroke="#c1440e" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
    <text x="230" y="182" fill="#5f6b7a" font-size="9">the serializer is the gate: invalid data</text>
    <text x="230" y="198" fill="#5f6b7a" font-size="9">never gets past it</text>
  </g>
</svg>
