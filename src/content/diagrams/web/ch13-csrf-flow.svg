<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 262" width="736" height="262" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="The victim's browser submitting an attacker's form with the real session cookie">
  <rect width="736" height="262" fill="#0b0d17"/>
  <defs>
    <marker id="ar13c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2703a"/>
    </marker>
    <marker id="ar13d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c1440e"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">the request is genuine, the intent is not</text>

    <rect x="0" y="26" width="170" height="70" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="85" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">1. victim logs in</text>
    <text x="85" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">ares-colony.com</text>
    <text x="85" y="82" fill="#8fd694" font-size="8" text-anchor="middle">session cookie stored</text>

    <rect x="265" y="26" width="170" height="70" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="350" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">2. visits bad site</text>
    <text x="350" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">in another tab</text>
    <text x="350" y="82" fill="#c1440e" font-size="8" text-anchor="middle">hidden auto-submit form</text>

    <rect x="530" y="26" width="170" height="70" rx="8" fill="#14162a" stroke="#7fb3ff"/>
    <text x="615" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">3. your server</text>
    <text x="615" y="66" fill="#5f6b7a" font-size="8" text-anchor="middle">cookie checks out</text>
    <text x="615" y="82" fill="#c1440e" font-size="8" text-anchor="middle">action performed</text>

    <path d="M172,60 L261,60" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar13c)"/>
    <path d="M437,60 L526,60" stroke="#c1440e" stroke-width="1.5" fill="none" marker-end="url(#ar13d)"/>
    <text x="481" y="54" fill="#c1440e" font-size="8" text-anchor="middle">POST</text>

    <rect x="150" y="118" width="400" height="52" rx="8" fill="#14162a" stroke="#f0b45e"/>
    <text x="350" y="138" fill="#f0b45e" font-size="9" text-anchor="middle">the browser attaches the session cookie automatically,</text>
    <text x="350" y="156" fill="#f0b45e" font-size="9" text-anchor="middle">because that is simply how cookies work</text>

    <path d="M350,100 L350,114" stroke="#f0b45e" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>

    <rect x="0" y="186" width="340" height="40" rx="8" fill="#14162a" stroke="#5f6b7a"/>
    <text x="170" y="204" fill="#d6d8ea" font-size="9" text-anchor="middle">the attacker cannot read the cookie</text>
    <text x="170" y="218" fill="#d6d8ea" font-size="9" text-anchor="middle">or the response. They do not need to.</text>

    <rect x="360" y="186" width="340" height="40" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="530" y="204" fill="#8fd694" font-size="9" text-anchor="middle">the fix: a CSRF token, which only</text>
    <text x="530" y="218" fill="#8fd694" font-size="9" text-anchor="middle">your own page can read and send</text>
  </g>
</svg>
