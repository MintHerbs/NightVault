<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 286" width="736" height="286" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="How a quote in user input escapes the string and becomes query logic">
  <rect width="736" height="286" fill="#0b0d17"/>
  <defs>
    <marker id="ar13" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">the same template, two different inputs</text>

    <text x="0" y="34" fill="#5f6b7a" font-size="9">the code you wrote</text>
    <rect x="0" y="42" width="700" height="30" rx="6" fill="#14162a" stroke="#2a2d45"/>
    <text x="12" y="62" fill="#d6d8ea" font-size="10">"SELECT * FROM users WHERE name = '" + user_input + "'"</text>

    <text x="0" y="98" fill="#8fd694" font-size="9">honest input:  Sarah</text>
    <rect x="0" y="106" width="700" height="30" rx="6" fill="#14162a" stroke="#8fd694"/>
    <text x="12" y="126" fill="#d6d8ea" font-size="10">SELECT * FROM users WHERE name = </text>
    <text x="210" y="126" fill="#8fd694" font-size="10">'Sarah'</text>
    <text x="560" y="126" fill="#8fd694" font-size="9">one row</text>

    <text x="0" y="162" fill="#c1440e" font-size="9">attacker input:  x' OR '1'='1</text>
    <rect x="0" y="170" width="700" height="46" rx="6" fill="#14162a" stroke="#c1440e"/>
    <text x="12" y="190" fill="#d6d8ea" font-size="10">SELECT * FROM users WHERE name = </text>
    <text x="210" y="190" fill="#f0b45e" font-size="10">'x'</text>
    <text x="234" y="190" fill="#c1440e" font-size="10">OR '1'='1'</text>
    <text x="560" y="190" fill="#c1440e" font-size="9">EVERY row</text>
    <text x="210" y="208" fill="#f0b45e" font-size="8">string closed early</text>
    <text x="350" y="208" fill="#c1440e" font-size="8">everything after it is query logic, not data</text>

    <rect x="0" y="230" width="700" height="20" rx="6" fill="#14162a" stroke="#8fd694"/>
    <text x="350" y="244" fill="#8fd694" font-size="9" text-anchor="middle">the fix: send the query and the value separately, so a quote is only ever a character in a name</text>
  </g>
</svg>
