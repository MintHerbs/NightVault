<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 250" width="736" height="250" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="A stored XSS payload saved once and served to every later visitor">
  <rect width="736" height="250" fill="#0b0d17"/>
  <defs>
    <marker id="ar13x" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c1440e"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">stored XSS: submitted once, runs for everyone</text>

    <rect x="0" y="26" width="150" height="76" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="75" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">attacker</text>
    <text x="75" y="68" fill="#c1440e" font-size="8" text-anchor="middle">submits as a name:</text>
    <text x="75" y="86" fill="#f0b45e" font-size="8" text-anchor="middle">&lt;script&gt;...&lt;/script&gt;</text>

    <rect x="275" y="26" width="150" height="76" rx="8" fill="#14162a" stroke="#7fb3ff"/>
    <text x="350" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">your database</text>
    <text x="350" y="68" fill="#5f6b7a" font-size="8" text-anchor="middle">stores it as text,</text>
    <text x="350" y="86" fill="#5f6b7a" font-size="8" text-anchor="middle">quite happily</text>

    <rect x="550" y="0" width="150" height="60" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="625" y="22" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">visitor A</text>
    <text x="625" y="40" fill="#c1440e" font-size="8" text-anchor="middle">script runs here</text>
    <text x="625" y="52" fill="#5f6b7a" font-size="8" text-anchor="middle">session stolen</text>

    <rect x="550" y="70" width="150" height="60" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="625" y="92" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">visitor B</text>
    <text x="625" y="110" fill="#c1440e" font-size="8" text-anchor="middle">script runs here</text>
    <text x="625" y="122" fill="#5f6b7a" font-size="8" text-anchor="middle">session stolen</text>

    <rect x="550" y="140" width="150" height="44" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="625" y="162" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">every visitor</text>
    <text x="625" y="176" fill="#c1440e" font-size="8" text-anchor="middle">...and so on, forever</text>

    <path d="M152,64 L271,64" stroke="#c1440e" stroke-width="1.5" fill="none" marker-end="url(#ar13x)"/>
    <text x="211" y="58" fill="#c1440e" font-size="8" text-anchor="middle">once</text>

    <path d="M427,58 L490,58 L490,30 L546,30" stroke="#c1440e" stroke-width="1.5" fill="none" marker-end="url(#ar13x)"/>
    <path d="M427,64 L490,64 L490,100 L546,100" stroke="#c1440e" stroke-width="1.5" fill="none" marker-end="url(#ar13x)"/>
    <path d="M427,70 L490,70 L490,162 L546,162" stroke="#c1440e" stroke-width="1.5" fill="none" marker-end="url(#ar13x)"/>
    <text x="470" y="86" fill="#5f6b7a" font-size="8">served to all</text>

    <rect x="0" y="196" width="700" height="20" rx="6" fill="#14162a" stroke="#8fd694"/>
    <text x="350" y="210" fill="#8fd694" font-size="9" text-anchor="middle">the fix: escape on output, so the browser sees text to display rather than a tag to run</text>
  </g>
</svg>
