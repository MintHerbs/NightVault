<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 264" width="736" height="264" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="A request passing through HTTPS, CSRF, validation, the ORM and output escaping">
  <rect width="736" height="264" fill="#0b0d17"/>
  <defs>
    <marker id="ar14" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2703a"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">defense in depth: each layer assumes the others might fail</text>

    <rect x="0" y="26" width="96" height="150" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="48" y="46" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">HTTPS</text>
    <text x="48" y="70" fill="#5f6b7a" font-size="8" text-anchor="middle">stops</text>
    <text x="48" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">snooping</text>
    <text x="48" y="98" fill="#d6d8ea" font-size="8" text-anchor="middle">on the</text>
    <text x="48" y="112" fill="#d6d8ea" font-size="8" text-anchor="middle">network</text>

    <rect x="120" y="26" width="96" height="150" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="168" y="46" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="168" y="70" fill="#5f6b7a" font-size="8" text-anchor="middle">stops</text>
    <text x="168" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">requests</text>
    <text x="168" y="98" fill="#d6d8ea" font-size="8" text-anchor="middle">from other</text>
    <text x="168" y="112" fill="#d6d8ea" font-size="8" text-anchor="middle">sites</text>

    <rect x="240" y="26" width="96" height="150" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="288" y="46" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">validation</text>
    <text x="288" y="70" fill="#5f6b7a" font-size="8" text-anchor="middle">stops</text>
    <text x="288" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">malformed</text>
    <text x="288" y="98" fill="#d6d8ea" font-size="8" text-anchor="middle">or illegal</text>
    <text x="288" y="112" fill="#d6d8ea" font-size="8" text-anchor="middle">values</text>

    <rect x="360" y="26" width="96" height="150" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="408" y="46" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">the ORM</text>
    <text x="408" y="70" fill="#5f6b7a" font-size="8" text-anchor="middle">stops</text>
    <text x="408" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">data from</text>
    <text x="408" y="98" fill="#d6d8ea" font-size="8" text-anchor="middle">becoming</text>
    <text x="408" y="112" fill="#d6d8ea" font-size="8" text-anchor="middle">query text</text>

    <rect x="480" y="26" width="96" height="150" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="528" y="46" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">escaping</text>
    <text x="528" y="70" fill="#5f6b7a" font-size="8" text-anchor="middle">stops</text>
    <text x="528" y="84" fill="#d6d8ea" font-size="8" text-anchor="middle">data from</text>
    <text x="528" y="98" fill="#d6d8ea" font-size="8" text-anchor="middle">becoming</text>
    <text x="528" y="112" fill="#d6d8ea" font-size="8" text-anchor="middle">markup</text>

    <rect x="600" y="26" width="100" height="150" rx="8" fill="#14162a" stroke="#7fb3ff"/>
    <text x="650" y="46" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">the user</text>
    <text x="650" y="84" fill="#8fd694" font-size="8" text-anchor="middle">safe page,</text>
    <text x="650" y="98" fill="#8fd694" font-size="8" text-anchor="middle">safe data</text>

    <path d="M98,150 L116,150" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar14)"/>
    <path d="M218,150 L236,150" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar14)"/>
    <path d="M338,150 L356,150" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar14)"/>
    <path d="M458,150 L476,150" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar14)"/>
    <path d="M578,150 L596,150" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar14)"/>

    <text x="0" y="204" fill="#5f6b7a" font-size="9">All five are on by default in Django. Every real vulnerability in this course is one of them</text>
    <text x="0" y="220" fill="#5f6b7a" font-size="9">switched off: DEBUG left on, |safe on user input, % formatting into raw(), or the CSRF</text>
    <text x="0" y="236" fill="#5f6b7a" font-size="9">middleware removed to make a POST work.</text>
  </g>
</svg>
