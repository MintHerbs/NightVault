<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 220" width="736" height="220" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="The path from a build through signing and review to a staged rollout">
  <rect width="736" height="220" fill="#0b0d17"/>
  <defs>
    <marker id="ar16" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2703a"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">the same seven steps on both platforms, with different names</text>

    <rect x="0" y="30" width="88" height="62" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="44" y="54" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">build</text>
    <text x="44" y="72" fill="#5f6b7a" font-size="8" text-anchor="middle">release,</text>
    <text x="44" y="84" fill="#5f6b7a" font-size="8" text-anchor="middle">not debug</text>

    <rect x="102" y="30" width="88" height="62" rx="8" fill="#14162a" stroke="#f0b45e"/>
    <text x="146" y="54" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">sign</text>
    <text x="146" y="72" fill="#f0b45e" font-size="8" text-anchor="middle">back this</text>
    <text x="146" y="84" fill="#f0b45e" font-size="8" text-anchor="middle">key up</text>

    <rect x="204" y="30" width="88" height="62" rx="8" fill="#14162a" stroke="#e2703a"/>
    <text x="248" y="54" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">upload</text>
    <text x="248" y="72" fill="#5f6b7a" font-size="8" text-anchor="middle">to the</text>
    <text x="248" y="84" fill="#5f6b7a" font-size="8" text-anchor="middle">console</text>

    <rect x="306" y="30" width="88" height="62" rx="8" fill="#14162a" stroke="#e2703a"/>
    <text x="350" y="54" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">listing</text>
    <text x="350" y="72" fill="#5f6b7a" font-size="8" text-anchor="middle">icon, shots,</text>
    <text x="350" y="84" fill="#5f6b7a" font-size="8" text-anchor="middle">rating</text>

    <rect x="408" y="30" width="88" height="62" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="452" y="54" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">declare</text>
    <text x="452" y="72" fill="#c1440e" font-size="8" text-anchor="middle">data you</text>
    <text x="452" y="84" fill="#c1440e" font-size="8" text-anchor="middle">collect</text>

    <rect x="510" y="30" width="88" height="62" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="554" y="54" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">review</text>
    <text x="554" y="72" fill="#5f6b7a" font-size="8" text-anchor="middle">hours to</text>
    <text x="554" y="84" fill="#5f6b7a" font-size="8" text-anchor="middle">days</text>

    <rect x="612" y="30" width="88" height="62" rx="8" fill="#14162a" stroke="#7fb3ff"/>
    <text x="656" y="54" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">roll out</text>
    <text x="656" y="72" fill="#5f6b7a" font-size="8" text-anchor="middle">all, or a</text>
    <text x="656" y="84" fill="#5f6b7a" font-size="8" text-anchor="middle">percentage</text>

    <path d="M90,61 L98,61" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar16)"/>
    <path d="M192,61 L200,61" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar16)"/>
    <path d="M294,61 L302,61" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar16)"/>
    <path d="M396,61 L404,61" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar16)"/>
    <path d="M498,61 L506,61" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar16)"/>
    <path d="M600,61 L608,61" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar16)"/>

    <path d="M554,96 L554,120 L350,120" stroke="#c1440e" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#ar16)"/>
    <text x="452" y="134" fill="#c1440e" font-size="9" text-anchor="middle">rejected: fix the listing or the code, then queue again</text>

    <rect x="0" y="150" width="700" height="34" rx="8" fill="#14162a" stroke="#5f6b7a"/>
    <text x="350" y="164" fill="#d6d8ea" font-size="9" text-anchor="middle">Most rejections are about permissions and privacy declarations, not code quality.</text>
    <text x="350" y="178" fill="#5f6b7a" font-size="9" text-anchor="middle">Never schedule a launch for the day you submit.</text>
  </g>
</svg>
