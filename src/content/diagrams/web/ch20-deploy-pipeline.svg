<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 262" width="736" height="262" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="The two release paths: backend to a host, and the app through review to the stores">
  <rect width="736" height="262" fill="#0b0d17"/>
  <defs>
    <marker id="ar20" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2703a"/>
    </marker>
  </defs>
  <g transform="translate(18, 18)">
    <text x="350" y="10" fill="#5f6b7a" font-size="10" text-anchor="middle">two things ship separately, and only one of them can be fixed in minutes</text>

    <text x="0" y="36" fill="#8fd694" font-size="9">backend: minutes, and you control it</text>
    <rect x="0" y="44" width="150" height="46" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="75" y="64" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">check --deploy</text>
    <text x="75" y="79" fill="#5f6b7a" font-size="8" text-anchor="middle">DEBUG = False</text>

    <rect x="180" y="44" width="150" height="46" rx="8" fill="#14162a" stroke="#8fd694"/>
    <text x="255" y="64" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">migrate</text>
    <text x="255" y="79" fill="#5f6b7a" font-size="8" text-anchor="middle">collectstatic</text>

    <rect x="360" y="44" width="150" height="46" rx="8" fill="#14162a" stroke="#7fb3ff"/>
    <text x="435" y="64" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">live server</text>
    <text x="435" y="79" fill="#5f6b7a" font-size="8" text-anchor="middle">HTTPS, real database</text>

    <path d="M152,67 L176,67" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar20)"/>
    <path d="M332,67 L356,67" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar20)"/>

    <text x="0" y="124" fill="#c1440e" font-size="9">app: days, and the stores control it</text>
    <rect x="0" y="132" width="150" height="46" rx="8" fill="#14162a" stroke="#f0b45e"/>
    <text x="75" y="152" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">build + sign</text>
    <text x="75" y="167" fill="#5f6b7a" font-size="8" text-anchor="middle">production API URL</text>

    <rect x="180" y="132" width="150" height="46" rx="8" fill="#14162a" stroke="#e2703a"/>
    <text x="255" y="152" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">beta track</text>
    <text x="255" y="167" fill="#5f6b7a" font-size="8" text-anchor="middle">TestFlight / internal</text>

    <rect x="360" y="132" width="150" height="46" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="435" y="152" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">review</text>
    <text x="435" y="167" fill="#5f6b7a" font-size="8" text-anchor="middle">hours to days</text>

    <rect x="540" y="132" width="160" height="46" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="620" y="148" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">users update</text>
    <text x="620" y="162" fill="#c1440e" font-size="8" text-anchor="middle">...eventually.</text>
    <text x="620" y="173" fill="#c1440e" font-size="8" text-anchor="middle">Some never do.</text>

    <path d="M152,155 L176,155" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar20)"/>
    <path d="M332,155 L356,155" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar20)"/>
    <path d="M512,155 L536,155" stroke="#e2703a" stroke-width="1.5" fill="none" marker-end="url(#ar20)"/>

    <path d="M620,178 L620,196 L435,196" stroke="#c1440e" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#ar20)"/>
    <path d="M435,196 L435,90" stroke="#c1440e" stroke-width="1.2" fill="none" marker-end="url(#ar20)"/>

    <rect x="0" y="210" width="700" height="34" rx="8" fill="#14162a" stroke="#c1440e"/>
    <text x="350" y="224" fill="#fff" font-size="9" text-anchor="middle">Old app versions keep calling your API forever. Never remove or rename a field a shipped app uses.</text>
    <text x="350" y="238" fill="#d6d8ea" font-size="9" text-anchor="middle">Add new fields, version the API when you must, and build a kill switch for versions that are too old.</text>
  </g>
</svg>
